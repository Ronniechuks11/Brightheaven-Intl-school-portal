{% extends "base.html" %}

{% block content %}

<section class="apply-section">

<div class="apply-overlay">

<div class="apply-header">

<span class="apply-tag">
🎓 Admissions 2026/2027
</span>

<h1>Admission Application</h1>

<p>
Complete the form below to apply for admission into
Brightheaven International School.
</p>

</div>

<form method="POST"
      enctype="multipart/form-data"
      class="application-form">

<div class="form-grid">

<div class="form-group">
<label>Passport Photograph</label>
<input type="file"
name="passport"
accept="image/*"
required>
</div>

<div class="form-group">
<label>Birth Certificate</label>
<input type="file"
name="birth_certificate"
accept=".pdf,.jpg,.jpeg,.png"
required>
</div>

<div class="form-group">
<label>First Name</label>
<input
type="text"
name="first_name"
required>
</div>

<div class="form-group">
<label>Last Name</label>
<input
type="text"
name="last_name"
required>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input
type="date"
name="date_of_birth"
required>
</div>

<div class="form-group">
<label>Gender</label>
<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="form-group">
<label>Class Applying For</label>
<select name="class_applying" required>

<option value="">Choose Class</option>

<option>Primary 1</option>
<option>Primary 2</option>
<option>Primary 3</option>

<option>JS1</option>
<option>JS2</option>
<option>JS3</option>

<option>SS1</option>
<option>SS2</option>
<option>SS3</option>

</select>
</div>

<div class="form-group">
<label>Parent / Guardian</label>
<input
type="text"
name="parent_name"
required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input
type="tel"
name="phone"
required>
</div>

<div class="form-group">
<label>Email Address</label>
<input
type="email"
name="email">
</div>

<div class="form-group full">
<label>Home Address</label>

<textarea
name="address"
rows="5">
</textarea>

</div>

</div>

<button class="submit-btn" type="submit">

Submit Application →

</button>

</form>

</div>

</section>

{% endblock %}
